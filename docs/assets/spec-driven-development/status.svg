<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="t d">
<title id="t">Status is computed from tests</title>
<desc id="d">Three merges to main. The first adds accounts B2, B5 and B6 as proposed. The second delivers B2, and the third delivers B5 and B6. A scenario is proposed until an active test of the kind its Verified names has its ID, then delivered.</desc>
<rect x="0.0" y="0.0" width="760.0" height="270.0" rx="12" fill="#0d1117"></rect><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#818b98"></path></marker></defs>

<text x="20" y="64" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="14px" fill="#f0f6fc" font-weight="600">main</text>
<path d="M160 60H740" marker-end="url(#a)" stroke="#9198a1" stroke-width="2" fill="none"></path>
<circle cx="270" cy="60" r="7" fill="#0d1117" stroke="#9198a1" stroke-width="2"></circle>
<circle cx="440" cy="60" r="7" fill="#0d1117" stroke="#9198a1" stroke-width="2"></circle>
<circle cx="610" cy="60" r="7" fill="#0d1117" stroke="#9198a1" stroke-width="2"></circle>
<text x="270" y="88" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="12px" fill="#9198a1">MR 1: adds them, proposed</text>
<text x="440" y="88" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="12px" fill="#9198a1">MR 2: delivers accounts B2</text>
<text x="610" y="88" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="12px" fill="#9198a1">MR 3: delivers B5, B6</text>

<text x="20" y="128" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="14px" fill="#f0f6fc">accounts B2</text>
<rect x="270" y="114" width="170" height="18" rx="4" fill="#262c36" stroke="#3d444d"></rect>
<rect x="440" y="114" width="300" height="18" rx="4" fill="#04260f" stroke="#2ea043"></rect>
<text x="20" y="160" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="14px" fill="#f0f6fc">accounts B5</text>
<rect x="270" y="146" width="340" height="18" rx="4" fill="#262c36" stroke="#3d444d"></rect>
<rect x="610" y="146" width="130" height="18" rx="4" fill="#04260f" stroke="#2ea043"></rect>
<text x="20" y="192" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="14px" fill="#f0f6fc">accounts B6</text>
<rect x="270" y="178" width="340" height="18" rx="4" fill="#262c36" stroke="#3d444d"></rect>
<rect x="610" y="178" width="130" height="18" rx="4" fill="#04260f" stroke="#2ea043"></rect>

<rect x="20" y="222" width="14" height="14" rx="3" fill="#262c36" stroke="#3d444d"></rect>
<text x="42" y="234" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="12px" fill="#9198a1"><tspan font-weight="600">Proposed</tspan>: no active test of the kind its Verified names has its ID, such as test.todo(&#34;B5: …&#34;)</text>
<rect x="20" y="244" width="14" height="14" rx="3" fill="#04260f" stroke="#2ea043"></rect>
<text x="42" y="256" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="12px" fill="#9198a1"><tspan font-weight="600">Delivered</tspan>: an active test of that kind has its ID in the title</text>
</svg>