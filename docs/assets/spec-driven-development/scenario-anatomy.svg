<text x="695" y="39" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,&#34;Noto Sans&#34;,Helvetica,Arial,sans-serif" font-size="14px" fill="#f0f6fc" font-weight="600">Verified</text>

<rect x="20" y="48" width="60" height="64" fill="#0d1117" stroke="#3d444d"></rect>
