<title id="t">Anatomy of a scenario</title>
<desc id="d">Accounts B2 as a row: an ID that is never reused, a Given for what is already true, a When for the one event, a Then for what a caller sees, and a Verified for what proves it.</desc>
<rect x="0.0" y="0.0" width="760.0" height="210.0" rx="12" fill="#0d1117"></rect><rect x="20" y="20" width="60" height="28" fill="#2a1f45" stroke="#a371f7"></rect>
