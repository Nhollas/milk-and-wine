schema_version: "1.1"
name: judge-007-discount-expected-today
description: "The test expects a discount on an order placed today"
tags: [easy, contradicts_requirement]
runs: 6
execution:
  prompt: Use the intent-judge agent to judge the tests of the discounts spec. Judge only B2. Reply with the agent's JSON reply and nothing else.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: found
    type: regex
    target: last_message
    flags: is
    pattern: '"scenario":\s*"B2",\s*"requirement":\s*"[^"]*Takes nothing off[^"]*"[^}]*"verdict":\s*"contradicts_requirement"'
  - name: never-reads-the-code
    type: tool_used
    tool: Read
    input_match: 'discounts/discounts\.ts"'
    min: 0
    max: 0
  - name: ran-the-judge
    type: tool_used
    tool: Agent
    min: 1
