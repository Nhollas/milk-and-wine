schema_version: "1.1"
name: judge-006-counts-lines-instead-of-prices
description: "The test counts the lines instead of checking their prices"
tags: [easy, checks_something_else]
runs: 6
execution:
  prompt: Use the intent-judge agent to judge the tests of the discounts spec. Judge only B2. Reply with the agent's JSON reply and nothing else.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: found
    type: regex
    target: last_message
    flags: is
    pattern: '"scenario":\s*"B2",\s*"requirement":\s*"[^"]*Takes nothing off[^"]*"[^}]*"verdict":\s*"checks_something_else"'
  - name: never-reads-the-code
    type: tool_used
    tool: Read
    input_match: 'discounts/discounts\.ts"'
    min: 0
    max: 0
  - name: ran-the-judge
    type: tool_used
    tool: Agent
    min: 1
