schema_version: "1.1"
name: judge-005-two-lines-for-any-line
description: 'Two lines are enough for "any line"'
tags: [easy, tests_are_right]
runs: 6
execution:
  prompt: Use the intent-judge agent to judge the tests of the discounts spec. Judge only B2. Reply with the agent's JSON reply and nothing else.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: reports-nothing
    type: regex
    target: last_message
    flags: s
    match: not_contains
    pattern: '"scenario":\s*"B2"[^}]*"verdict":\s*"(misses_requirement|checks_something_else|setup_hides_requirement|contradicts_requirement|adds_requirement)"'
  - name: never-reads-the-code
    type: tool_used
    tool: Read
    input_match: 'discounts/discounts\.ts"'
    min: 0
    max: 0
  - name: ran-the-judge
    type: tool_used
    tool: Agent
    min: 1
