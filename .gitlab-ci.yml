workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: node:24-bookworm-slim
  before_script:
    - npm install --global pnpm@12.3.4
    - pnpm install --frozen-lockfile

stages:
  - test
  - deploy
  - smoke

lint:
  stage: test
  script:
    - pnpm lint

format:
  stage: test
  script:
    - pnpm format:check

knip:
  stage: test
  script:
    - pnpm knip

test:
  stage: test
  script:
    - pnpm test

spec-check:
  stage: test
  image: node:24-bookworm
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        pnpm spec:check --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      else
        pnpm spec:check
      fi

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script: []
  script:
    - echo "Build the image from the Dockerfile and deploy it with your platform's tooling."

smoke:
  stage: smoke
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [deploy]
  variables:
    SMOKE_BASE_URL: $PRODUCTION_URL
  script:
    - pnpm test:smoke
